version: 2.1
orbs:
  aws-s3: circleci/aws-s3@3.0.0
executors:
  node-executor:
    docker:
      - image: cimg/node:24.11.0
commands:
  checkout-repo:
    description: Check out the current commit over HTTPS
    steps:
      - run:
          name: 'Checkout code'
          command: |
            git clone https://github.com/justaddcl/yujinelson.com.git .
            git checkout "$CIRCLE_SHA1"
  verify-node-version:
    description: Check Node.js version used for the build
    steps:
      - run:
          name: 'Check Node.js version used for the build'
          command: 'node -v'
  setup:
    description: Set up the project to run commands against
    steps:
      - checkout-repo
      - verify-node-version
      - run: npm install
jobs:
  lint_check:
    executor: node-executor
    steps:
      - setup
      - run: npm run lint
      - run: npm run prettier-check
      - run: npm run check-cv
  deploy-production:
    executor: node-executor
    steps:
      - setup
      - run: npm run build
      - aws-s3/sync:
          from: public
          to: 's3://yujinelson.com/'
          arguments: |
            --acl public-read \
            --cache-control "max-age=86400" \
      - run:
          name: Publish stable CV aliases
          command: node scripts/publish-cv-aliases.js
workflows:
  version: 2
  validation:
    jobs:
      - lint_check
      - deploy-production:
          filters:
            branches:
              only: master
          requires:
            - lint_check
